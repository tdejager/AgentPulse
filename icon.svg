<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="glass-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0083b0"/>
    </linearGradient>
    <linearGradient id="glass-r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0083b0"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filter for the glasses -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle radar pulse rings behind the face -->
  <circle cx="512" cy="480" r="320" fill="none" stroke="#00d2ff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="512" cy="480" r="250" fill="none" stroke="#00d2ff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="512" cy="480" r="180" fill="none" stroke="#00d2ff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Head silhouette (simple oval) -->
  <ellipse cx="512" cy="440" rx="180" ry="210" fill="#232946" stroke="#2d3561" stroke-width="3"/>

  <!-- Sunglasses frame - thick bridge -->
  <rect x="410" y="400" width="204" height="8" rx="4" fill="#e0e0e0"/>

  <!-- Left lens -->
  <rect x="270" y="370" width="200" height="90" rx="20" ry="20" fill="url(#glass-l)" filter="url(#glow)" opacity="0.9"/>
  <!-- Left lens shine -->
  <rect x="285" y="380" width="80" height="15" rx="7" fill="white" opacity="0.25"/>

  <!-- Right lens -->
  <rect x="554" y="370" width="200" height="90" rx="20" ry="20" fill="url(#glass-r)" filter="url(#glow)" opacity="0.9"/>
  <!-- Right lens shine -->
  <rect x="569" y="380" width="80" height="15" rx="7" fill="white" opacity="0.25"/>

  <!-- Frame arms going to sides -->
  <line x1="270" y1="415" x2="200" y2="400" stroke="#e0e0e0" stroke-width="7" stroke-linecap="round"/>
  <line x1="754" y1="415" x2="824" y2="400" stroke="#e0e0e0" stroke-width="7" stroke-linecap="round"/>

  <!-- Subtle smirk/mouth -->
  <path d="M 460 530 Q 512 555 564 530" fill="none" stroke="#4a5580" stroke-width="4" stroke-linecap="round"/>

  <!-- Pulse line at bottom -->
  <g filter="url(#soft-glow)">
    <path d="M 200 720 L 380 720 L 420 680 L 460 760 L 500 700 L 530 740 L 560 720 L 824 720"
          fill="none" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- "AP" text below pulse -->
  <text x="512" y="830" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="80"
        font-weight="700" fill="#00d2ff" text-anchor="middle" opacity="0.6" letter-spacing="12">AP</text>
</svg>
